name: 'Runtime checks'
description: 'Run dynamic analysis tools'

runs:
  using: "composite"
  steps:
    - name: Cache restore tools
      # renovate: datasource=github-tags depName=actions/cache versioning=loose
      uses: actions/cache/restore@v4.3.0
      if: runner.os == 'Linux' && matrix.runs_msan == true
      id: cache-tools
      with:
        path: tools
        key: tools-clang-${{ matrix.clang_ver }}-stdlib-msan

    - name: Setup memory sanitizer
      shell: bash
      if: runner.os == 'Linux' && matrix.runs_msan == true && steps.cache-tools.outputs.cache-hit != 'true'
      run: |
        mkdir -p tools
        cd tools
        git clone --depth=1 --branch=llvmorg-${{ matrix.clang_ver_full }} https://github.com/llvm/llvm-project
        cd llvm-project
        # mkdir build; cd build
        sudo ln -s -f /usr/bin/$CC /usr/bin/clang
        sudo ln -s -f /usr/bin/$CXX /usr/bin/clang++
        # https://github.com/llvm/llvm-project/issues/78354
        sudo sysctl vm.mmap_rnd_bits=28
        cmake -G Ninja -S runtimes -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind" \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DLLVM_USE_SANITIZER=MemoryWithOrigins \
          -DCMAKE_BUILD_WITH_INSTALL_RPATH=true
        cmake --build build -j6 -- cxx cxxabi

    - name: Cache save tools
      # renovate: datasource=github-tags depName=actions/cache versioning=loose
      uses: actions/cache/save@v4.3.0
      if: runner.os == 'Linux' && matrix.runs_msan == true && steps.cache-tools.outputs.cache-hit != 'true'
      with:
        path: tools
        key: tools-clang-${{ matrix.clang_ver }}-stdlib-msan

    - name: Sanitizers
      shell: bash
      # run one sanitizer for each env to avoid building extra binaries on one env
      if: (matrix.runs_asan == true || matrix.runs_msan == true) && runner.os != 'Windows'
      # detect_leaks is not supported on macOS
      # env:
      #   ASAN_OPTIONS: detect_leaks=1
      run: |
        set -euo pipefail

        # Configure ASan defaults. Leak detection unsupported on macOS.
        if [ "${RUNNER_OS:-}" = "Linux" ]; then
          export ASAN_OPTIONS="halt_on_error=1:abort_on_error=1:detect_leaks=1:color=always"
        else
          export ASAN_OPTIONS="halt_on_error=1:abort_on_error=1:color=always"
        fi

        CMD="./${{ env.ZIP_NAME }}/\"${EXECUTABLE_NAME}\""
        PIPE_CMD="cat \"${INPUT_FILENAME}\" | tr -d '\r' | ${CMD}"

        # Give FTXUI a PTY so it initializes, and time-box execution to avoid hangs in CI.
        if [ "${RUNNER_OS:-}" = "Linux" ] && command -v script >/dev/null 2>&1; then
          timeout -s SIGINT 8s script -qfec "bash -lc '${PIPE_CMD}'" /dev/null || code=$?
        elif [ "${RUNNER_OS:-}" = "Linux" ]; then
          timeout -s SIGINT 8s bash -lc "${PIPE_CMD}" || code=$?
        else
          # On macOS (no GNU timeout by default), just run without timeout.
          bash -lc "${PIPE_CMD}" || code=$?
        fi

        code="${code:-0}"
        # 124 is timeout -> treat as success (we only need a short run for sanitizer coverage)
        if [ "$code" != 0 ] && [ "$code" != 124 ]; then
          exit "$code"
        fi

    - name: Sanitizers (Windows MSVC)
      shell: bash
      # run one sanitizer for each OS to avoid building extra binaries
      if: matrix.cxx == 'cl' && matrix.runs_asan == true
      continue-on-error: true
      run: |
        timeout 8s ./${{ env.ZIP_NAME }}/"${EXECUTABLE_NAME}".exe || code=$?
        code="${code:-0}"
        # Treat timeout (124) as success
        if [ "$code" != 0 ] && [ "$code" != 124 ]; then
          exit "$code"
        fi

    - name: Valgrind
      shell: bash
      if: runner.os == 'Linux' && matrix.runs_valgrind == true
      run: |
        set -euo pipefail

        if [ "${RUNNER_OS:-}" = "Linux" ]; then
          timeout -s SIGINT 20s bash ./scripts/run_valgrind.sh "${{ env.ZIP_NAME }}" || code=$?
        else
          bash ./scripts/run_valgrind.sh "${{ env.ZIP_NAME }}" || code=$?
        fi

        code="${code:-0}"
        if [ "$code" = 124 ]; then
          echo "Valgrind timed out (expected in CI UI mode). No errors reported."
          exit 0
        fi
        exit "$code"
